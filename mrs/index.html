<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lista pessoal de tarefas com status e previsão de término.">
  <meta name="robots" content="noindex, nofollow">
  <title>MRS — Meu dia</title>
  <style>
    :root {
      --ink: #18243f;
      --muted: #657089;
      --paper: #f3f5f9;
      --card: rgba(255, 255, 255, .92);
      --line: #d9deea;
      --green: #273e77;
      --green-soft: #e5e9f3;
      --amber: #ffd600;
      --blue: #273e77;
      --navy: #1f315f;
      --yellow: #ffd600;
      --shadow: 0 22px 60px rgba(31, 49, 95, .14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255,214,0,.13) 0 18%, transparent 18% 100%),
        radial-gradient(circle at 92% 12%, rgba(39,62,119,.13), transparent 30rem),
        linear-gradient(180deg, #f7f8fb 0%, #eef1f7 100%);
      font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page { width: min(1240px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 72px; }

    header {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 28px;
      align-items: end;
      margin-bottom: 34px;
      padding: 28px 30px;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(255,214,0,.98) 0 18%, transparent 18% 100%),
        linear-gradient(118deg, #1f315f 0%, #2c4787 72%, #35579f 100%);
      border-radius: 30px;
      box-shadow: 0 24px 54px rgba(31,49,95,.25);
      overflow: hidden;
    }
    .eyebrow { margin: 0 0 10px; color: rgba(255,255,255,.76); font-weight: 750; letter-spacing: .14em; text-transform: uppercase; font-size: .75rem; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 8vw, 6.3rem); font-weight: 500; letter-spacing: -.065em; line-height: .92; }
    .brand-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .mrs-logo { width: 178px; max-width: 44vw; height: auto; display: block; filter: drop-shadow(0 7px 14px rgba(0,0,0,.16)); }
    .brand-tag { font-size: .78rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; color: rgba(255,255,255,.86); }
    .subtitle { margin: 18px 0 0; max-width: 600px; color: rgba(255,255,255,.88); }

    .progress-card { min-width: 190px; padding: 18px 20px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.26); border-radius: 22px; box-shadow: 0 12px 28px rgba(0,0,0,.10); backdrop-filter: blur(12px); }
    .progress-top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .progress-top strong { font-size: 1.45rem; }
    .progress-top span { color: rgba(255,255,255,.82); font-size: .85rem; }
    .track { height: 7px; margin-top: 14px; overflow: hidden; background: rgba(255,255,255,.28); border-radius: 999px; }
    .bar { width: 0; height: 100%; background: var(--yellow); border-radius: inherit; transition: width .3s ease; }

    .day-tabs { display: flex; gap: 8px; margin: 0 0 16px; padding: 4px 2px; overflow-x: auto; scrollbar-width: thin; }
    .day-tab { flex: 0 0 auto; padding: 10px 15px; color: var(--muted); background: rgba(255,255,255,.58); border: 1px solid var(--line); border-radius: 999px; font: 650 .88rem/1 inherit; cursor: pointer; }
    .day-tab.active { color: white; background: var(--green); border-color: var(--green); }

    .toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
    .viewing { color: var(--muted); font-size: .9rem; }
    .action-button { min-height: 42px; padding: 0 16px; color: white; background: var(--green); border: 0; border-radius: 12px; font: 700 .88rem/1 inherit; cursor: pointer; box-shadow: 0 8px 20px rgba(65,106,82,.18); }
    .action-button.secondary { color: var(--green); background: var(--green-soft); box-shadow: none; }
    .action-button:disabled { opacity: .45; cursor: not-allowed; }

    .add-form { display: grid; grid-template-columns: 1fr 190px 190px auto; gap: 12px; margin: 0 0 18px; padding: 16px; background: rgba(255,255,255,.66); border: 1px solid rgba(255,255,255,.96); border-radius: 20px; box-shadow: 0 12px 32px rgba(42,48,40,.07); }
    .add-form input[type="text"], .task input[type="text"] { width: 100%; min-height: 44px; padding: 0 14px; color: var(--ink); background: rgba(247,245,239,.82); border: 1px solid #d4d4ca; border-radius: 12px; font: inherit; outline: none; }
    .add-form input:focus, .task input[type="text"]:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(65,106,82,.13); }
    .empty { padding: 48px 24px; color: var(--muted); text-align: center; }

    .board { overflow: hidden; background: var(--card); border: 1px solid rgba(255,255,255,.96); border-radius: 28px; box-shadow: var(--shadow); backdrop-filter: blur(14px); }
    .board-head, .task { display: grid; grid-template-columns: minmax(260px, 1fr) 180px 190px 175px; column-gap: 18px; align-items: center; }
    .board-head { padding: 16px 24px; color: var(--muted); border-bottom: 1px solid var(--line); font-size: .74rem; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .task { min-height: 88px; padding: 16px 24px; border-bottom: 1px solid var(--line); transition: background .2s ease, opacity .2s ease; }
    .task:last-child { border-bottom: 0; }
    .task:hover { background: rgba(255,255,255,.48); }
    .task.done { opacity: .62; }
    .task.done .task-name { text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .name-wrap { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .number { display: grid; flex: 0 0 auto; place-items: center; width: 34px; height: 34px; color: var(--green); background: var(--green-soft); border-radius: 50%; font: 600 .85rem Georgia, serif; }
    .task-name { font-weight: 680; }

    select, input[type="date"], .task input[type="text"] {
      width: 100%; min-height: 44px; padding: 0 12px; color: var(--ink); background: rgba(247,245,239,.82); border: 1px solid #d4d4ca; border-radius: 12px; font: inherit; outline: none; transition: border .2s, box-shadow .2s;
    }
    select:focus, input[type="date"]:focus, .task input[type="text"]:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(65,106,82,.13); }
    select { cursor: pointer; }

    .footer-note { display: flex; gap: 10px; align-items: center; margin: 18px 4px 0; color: var(--muted); font-size: .84rem; }
    .saved-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 0 4px rgba(65,106,82,.10); }

    @media (max-width: 760px) {
      .page { width: min(100% - 20px, 580px); padding-top: 38px; }
      header { grid-template-columns: 1fr; align-items: start; }
      .progress-card { width: 100%; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .add-form { grid-template-columns: 1fr; }
      .board-head { display: none; }
      .task { grid-template-columns: 1fr; gap: 12px; padding: 20px; }
      .task::before { display: none; }
      select, input[type="date"] { min-height: 48px; }
      .task select { margin-top: 2px; }
      .task select, .task input { position: relative; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <div class="brand-row">
          <svg class="mrs-logo" viewBox="0 0 430 120" role="img" aria-label="MRS Logística">
            <g fill="#ffd600">
              <path d="M8 10h122l72 50-72 50H8l72-50z"/>
              <path d="M120 10h122l72 50-72 50H120l72-50z"/>
              <path d="M232 10h122l72 50-72 50H232l72-50z"/>
            </g>
            <g fill="#273e77" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="62">
              <text x="57" y="82">M</text>
              <text x="177" y="82">R</text>
              <text x="291" y="82">S</text>
            </g>
          </svg>
          <span class="brand-tag">Rotina de trabalho</span>
        </div>
        <p class="eyebrow" id="today">Hoje</p>
        <h1>Meu dia.</h1>
        <p class="subtitle">Atividades, andamento, prazos e entregas da rotina MRS.</p>
      </div>
      <section class="progress-card" aria-label="Progresso das tarefas">
        <div class="progress-top"><strong id="progress-count">0/9</strong><span>concluídas</span></div>
        <div class="track"><div class="bar" id="progress-bar"></div></div>
      </section>
    </header>

    <nav class="day-tabs" id="day-tabs" aria-label="Dias disponíveis"></nav>
    <div class="toolbar">
      <span class="viewing" id="viewing-day"></span>
      <button class="action-button secondary" id="carry-button" type="button">Transferir pendentes para amanhã</button>
    </div>

    <form class="add-form" id="add-form">
      <input id="new-task" type="text" placeholder="Nova atividade" aria-label="Nova atividade" required>
      <input id="new-project" type="text" list="project-options" placeholder="Projeto / Frente" aria-label="Projeto ou frente">
      <datalist id="project-options">
        <option value="SNO1"></option>
        <option value="IPA"></option>
        <option value="Sinalização"></option>
        <option value="Segregações"></option>
        <option value="Geral"></option>
      </datalist>
      <input id="new-date" type="date" aria-label="Previsão de término da nova atividade">
      <button class="action-button" type="submit">Incluir atividade</button>
    </form>

    <section class="board" aria-label="Lista de tarefas">
      <div class="board-head"><span>Atividade</span><span>Projeto / Frente</span><span>Status</span><span>Previsão de término</span></div>
      <div id="task-list"></div>
    </section>
    <p class="footer-note"><span class="saved-dot"></span><span>Alterações salvas automaticamente neste navegador.</span></p>
  </main>

  <script>
    const initialTasks = [];
    const statuses = ["A iniciar", "Em andamento", "Aguardando", "Concluído"];
    const oldStorageKey = "mrs-dia-tarefas-v1";
    const storageKey = "mrs-dia-agenda-v1";
    const localDate = date => {
      const offset = date.getTimezoneOffset();
      return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
    };
    const todayKey = localDate(new Date());
    let activeDay = todayKey;
    let agenda = JSON.parse(localStorage.getItem(storageKey) || "null");

    if (!agenda) {
      const oldData = JSON.parse(localStorage.getItem(oldStorageKey) || "{}");
      agenda = { days: {} };
      agenda.days[todayKey] = initialTasks.map((name, index) => ({
        id: `${todayKey}-${index}-${Date.now()}`,
        name,
        status: oldData[index]?.status || "A iniciar",
        date: oldData[index]?.date || ""
      }));
      saveAgenda();
    }

    if (!agenda.days[todayKey]) agenda.days[todayKey] = [];

    // Migração transparente para o histórico enriquecido.
    Object.entries(agenda.days).forEach(([dayKey, tasks]) => {
      tasks.forEach(item => {
        if (!item.project) item.project = "";
        if (!item.createdAt) item.createdAt = dayKey;
        if (item.completedAt === undefined) item.completedAt = item.status === "Concluído" ? dayKey : "";
      });
    });
    saveAgenda();

    document.querySelector("#today").textContent = new Intl.DateTimeFormat("pt-BR", {
      weekday: "long", day: "numeric", month: "long"
    }).format(new Date());

    const list = document.querySelector("#task-list");
    const tabs = document.querySelector("#day-tabs");
    const form = document.querySelector("#add-form");
    const carryButton = document.querySelector("#carry-button");

    function dayLabel(key, long = false) {
      const date = new Date(`${key}T12:00:00`);
      if (key === todayKey && !long) return "Hoje";
      return new Intl.DateTimeFormat("pt-BR", long
        ? { weekday: "long", day: "numeric", month: "long", year: "numeric" }
        : { day: "2-digit", month: "short" }).format(date);
    }

    function saveAgenda() {
      localStorage.setItem(storageKey, JSON.stringify(agenda));
    }

    function renderTabs() {
      tabs.innerHTML = "";
      Object.keys(agenda.days).sort().forEach(key => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `day-tab${key === activeDay ? " active" : ""}`;
        button.textContent = dayLabel(key);
        button.setAttribute("aria-current", key === activeDay ? "date" : "false");
        button.addEventListener("click", () => { activeDay = key; render(); });
        tabs.appendChild(button);
      });
    }

    function renderTasks() {
      list.innerHTML = "";
      const tasks = agenda.days[activeDay] || [];
      const isPast = activeDay < todayKey;
      if (!tasks.length) {
        list.innerHTML = '<p class="empty">Nenhuma atividade neste dia.</p>';
        updateProgress();
        return;
      }
      tasks.forEach((data, index) => {
      const row = document.createElement("article");
      row.className = `task${data.status === "Concluído" ? " done" : ""}`;
      row.innerHTML = `
        <div class="name-wrap"><span class="number">${String(index + 1).padStart(2, "0")}</span><span class="task-name"></span></div>
        <input class="project-input" type="text" list="project-options" value="" aria-label="Projeto ou frente" ${isPast ? "disabled" : ""}>
        <select aria-label="Status da atividade" ${isPast ? "disabled" : ""}>${statuses.map(status => `<option${status === data.status ? " selected" : ""}>${status}</option>`).join("")}</select>
        <input type="date" value="${data.date || ""}" aria-label="Previsão de término" ${isPast ? "disabled" : ""}>
      `;
      row.querySelector(".task-name").textContent = data.name;
      const project = row.querySelector(".project-input");
      const select = row.querySelector("select");
      const date = row.querySelector('input[type="date"]');
      project.value = data.project || "";
      const save = () => {
        const previousStatus = data.status;
        data.project = project.value.trim();
        data.status = select.value;
        data.date = date.value;
        if (data.status === "Concluído" && previousStatus !== "Concluído") {
          data.completedAt = localDate(new Date());
        } else if (data.status !== "Concluído" && previousStatus === "Concluído") {
          data.completedAt = "";
        }
        saveAgenda();
        row.classList.toggle("done", select.value === "Concluído");
        updateProgress();
      };
      project.addEventListener("change", save);
      select.addEventListener("change", save);
      date.addEventListener("change", save);
      list.appendChild(row);
      });
      updateProgress();
    }

    function updateProgress() {
      const tasks = agenda.days[activeDay] || [];
      const completed = tasks.filter(item => item.status === "Concluído").length;
      document.querySelector("#progress-count").textContent = `${completed}/${tasks.length}`;
      document.querySelector("#progress-bar").style.width = `${tasks.length ? (completed / tasks.length) * 100 : 0}%`;
    }

    function render() {
      renderTabs();
      renderTasks();
      const isPast = activeDay < todayKey;
      document.querySelector("#viewing-day").textContent = `${isPast ? "Consulta: " : "Planejamento: "}${dayLabel(activeDay, true)}`;
      form.hidden = isPast;
      carryButton.hidden = isPast;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const nameInput = document.querySelector("#new-task");
      const projectInput = document.querySelector("#new-project");
      const dateInput = document.querySelector("#new-date");
      const name = nameInput.value.trim();
      if (!name) return;
      if (!agenda.days[activeDay]) agenda.days[activeDay] = [];
      agenda.days[activeDay].push({
        id: `${activeDay}-${Date.now()}`,
        name,
        project: projectInput.value.trim(),
        status: "A iniciar",
        date: dateInput.value,
        createdAt: localDate(new Date()),
        completedAt: ""
      });
      saveAgenda();
      nameInput.value = "";
      projectInput.value = "";
      dateInput.value = "";
      render();
      nameInput.focus();
    });

    carryButton.addEventListener("click", () => {
      const source = agenda.days[activeDay] || [];
      const pending = source.filter(item => item.status !== "Concluído");
      if (!pending.length) return;
      const next = new Date(`${activeDay}T12:00:00`);
      next.setDate(next.getDate() + 1);
      const nextKey = localDate(next);
      if (!agenda.days[nextKey]) agenda.days[nextKey] = [];
      const existing = new Set(agenda.days[nextKey].map(item => item.name.toLocaleLowerCase("pt-BR")));
      pending.forEach(item => {
        if (!existing.has(item.name.toLocaleLowerCase("pt-BR"))) {
          agenda.days[nextKey].push({
            ...item,
            id: `${nextKey}-${Date.now()}-${Math.random()}`,
            status: "A iniciar",
            completedAt: ""
          });
        }
      });
      saveAgenda();
      activeDay = nextKey;
      render();
    });

    render();
  </script>
</body>
</html>
