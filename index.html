<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lista pessoal de tarefas com status e previsão de término.">
  <meta name="robots" content="noindex, nofollow">
  <title>Meu dia — To do</title>
  <style>
    :root {
      --ink: #20231f;
      --muted: #72776f;
      --paper: #f7f5ef;
      --card: rgba(255, 255, 255, .78);
      --line: #deddd4;
      --green: #416a52;
      --green-soft: #dce8df;
      --amber: #b7732e;
      --blue: #52718a;
      --shadow: 0 22px 60px rgba(42, 48, 40, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 10%, rgba(197, 216, 198, .75), transparent 28rem),
        radial-gradient(circle at 92% 86%, rgba(231, 210, 177, .55), transparent 30rem),
        var(--paper);
      font: 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 72px; }

    header { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: end; margin-bottom: 34px; }
    .eyebrow { margin: 0 0 10px; color: var(--green); font-weight: 750; letter-spacing: .14em; text-transform: uppercase; font-size: .75rem; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 8vw, 6.3rem); font-weight: 500; letter-spacing: -.065em; line-height: .92; }
    .subtitle { margin: 18px 0 0; max-width: 600px; color: var(--muted); }

    .progress-card { min-width: 190px; padding: 18px 20px; background: var(--card); border: 1px solid rgba(255,255,255,.95); border-radius: 22px; box-shadow: var(--shadow); backdrop-filter: blur(12px); }
    .progress-top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .progress-top strong { font-size: 1.45rem; }
    .progress-top span { color: var(--muted); font-size: .85rem; }
    .track { height: 7px; margin-top: 14px; overflow: hidden; background: #e7e6df; border-radius: 999px; }
    .bar { width: 0; height: 100%; background: var(--green); border-radius: inherit; transition: width .3s ease; }

    .board { overflow: hidden; background: var(--card); border: 1px solid rgba(255,255,255,.96); border-radius: 28px; box-shadow: var(--shadow); backdrop-filter: blur(14px); }
    .board-head, .task { display: grid; grid-template-columns: minmax(220px, 1fr) 210px 180px; column-gap: 18px; align-items: center; }
    .board-head { padding: 16px 24px; color: var(--muted); border-bottom: 1px solid var(--line); font-size: .74rem; font-weight: 750; letter-spacing: .11em; text-transform: uppercase; }
    .task { min-height: 88px; padding: 16px 24px; border-bottom: 1px solid var(--line); transition: background .2s ease, opacity .2s ease; }
    .task:last-child { border-bottom: 0; }
    .task:hover { background: rgba(255,255,255,.48); }
    .task.done { opacity: .62; }
    .task.done .task-name { text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .name-wrap { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .number { display: grid; flex: 0 0 auto; place-items: center; width: 34px; height: 34px; color: var(--green); background: var(--green-soft); border-radius: 50%; font: 600 .85rem Georgia, serif; }
    .task-name { font-weight: 680; }

    select, input[type="date"] {
      width: 100%; min-height: 44px; padding: 0 12px; color: var(--ink); background: rgba(247,245,239,.82); border: 1px solid #d4d4ca; border-radius: 12px; font: inherit; outline: none; transition: border .2s, box-shadow .2s;
    }
    select:focus, input[type="date"]:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(65,106,82,.13); }
    select { cursor: pointer; }

    .footer-note { display: flex; gap: 10px; align-items: center; margin: 18px 4px 0; color: var(--muted); font-size: .84rem; }
    .saved-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 0 4px rgba(65,106,82,.10); }

    @media (max-width: 760px) {
      .page { width: min(100% - 20px, 580px); padding-top: 38px; }
      header { grid-template-columns: 1fr; align-items: start; }
      .progress-card { width: 100%; }
      .board-head { display: none; }
      .task { grid-template-columns: 1fr; gap: 12px; padding: 20px; }
      .task::before { display: none; }
      select, input[type="date"] { min-height: 48px; }
      .task select { margin-top: 2px; }
      .task select, .task input { position: relative; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow" id="today">Hoje</p>
        <h1>Meu dia.</h1>
        <p class="subtitle">Um lugar simples para acompanhar o que precisa sair do papel.</p>
      </div>
      <section class="progress-card" aria-label="Progresso das tarefas">
        <div class="progress-top"><strong id="progress-count">0/9</strong><span>concluídas</span></div>
        <div class="track"><div class="bar" id="progress-bar"></div></div>
      </section>
    </header>

    <section class="board" aria-label="Lista de tarefas">
      <div class="board-head"><span>Atividade</span><span>Status</span><span>Previsão de término</span></div>
      <div id="task-list"></div>
    </section>
    <p class="footer-note"><span class="saved-dot"></span><span>Alterações salvas automaticamente neste navegador.</span></p>
  </main>

  <script>
    const tasks = [
      "Doação do baú",
      "Compras de abastecimento",
      "Planilha financeira",
      "Criar suporte articulado de madeira",
      "Fixar monitor",
      "Lavar roupas",
      "Organizar pós-graduação",
      "Malhar — Smart Fit",
      "Alterar posição do modem Vivo"
    ];
    const statuses = ["A iniciar", "Em andamento", "Aguardando", "Concluído"];
    const storageKey = "meu-dia-tarefas-v1";
    const stored = JSON.parse(localStorage.getItem(storageKey) || "{}");

    document.querySelector("#today").textContent = new Intl.DateTimeFormat("pt-BR", {
      weekday: "long", day: "numeric", month: "long"
    }).format(new Date());

    const list = document.querySelector("#task-list");
    tasks.forEach((name, index) => {
      const data = stored[index] || { status: "A iniciar", date: "" };
      const row = document.createElement("article");
      row.className = `task${data.status === "Concluído" ? " done" : ""}`;
      row.innerHTML = `
        <div class="name-wrap"><span class="number">${String(index + 1).padStart(2, "0")}</span><span class="task-name">${name}</span></div>
        <select aria-label="Status de ${name}">${statuses.map(status => `<option${status === data.status ? " selected" : ""}>${status}</option>`).join("")}</select>
        <input type="date" value="${data.date}" aria-label="Previsão de término de ${name}">
      `;
      const select = row.querySelector("select");
      const date = row.querySelector("input");
      const save = () => {
        stored[index] = { status: select.value, date: date.value };
        localStorage.setItem(storageKey, JSON.stringify(stored));
        row.classList.toggle("done", select.value === "Concluído");
        updateProgress();
      };
      select.addEventListener("change", save);
      date.addEventListener("change", save);
      list.appendChild(row);
    });

    function updateProgress() {
      const completed = [...document.querySelectorAll("select")].filter(item => item.value === "Concluído").length;
      document.querySelector("#progress-count").textContent = `${completed}/${tasks.length}`;
      document.querySelector("#progress-bar").style.width = `${(completed / tasks.length) * 100}%`;
    }
    updateProgress();
  </script>
</body>
</html>
